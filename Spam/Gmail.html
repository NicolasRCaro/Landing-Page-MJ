<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MJ App — Recibe tu acceso por correo</title>

  <!-- Tipografías -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="./Gmail.css">

  <!-- EmailJS SDK v4 -->
  <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/@emailjs/browser@4/dist/email.min.js"></script>
</head>
<body class="era-thriller"> <!-- Era predeterminada -->

  <main class="stage">
    <!-- VIDEO DE FONDO -->
    <video id="bg-video" class="bg-video" autoplay loop muted playsinline>
      <source id="bg-video-src" src="Thriller.mp4" type="video/mp4">
    </video>

    <div class="stage__glow" aria-hidden="true"></div>

    <section class="card">
      
      <!-- 👑 SELECTOR DE ERAS EN LA PARTE SUPERIOR DEL LOGO -->
      <nav class="era-switcher" aria-label="Seleccionar era">
        <button type="button" class="era-btn" data-era="offthewall" data-video="./offthewall.mp4.mp4">Off The Wall</button>
        <button type="button" class="era-btn active" data-era="thriller" data-video="./Thriller.mp4">Thriller</button>
        <button type="button" class="era-btn" data-era="bad" data-video="./Bad.mp4">Bad</button>
      </nav>

      <img
        src="https://identidad-de-marca-delta.vercel.app/assets/LogoMJ.png"
        alt="Logo MJ App"
        class="card__logo"
      >

      <h1 class="card__title">Entra a la <span>leyenda.</span></h1>
      <p class="card__slogan">Toma sus decisiones. Vive su historia.</p>

      <form id="email-form" class="form">
        <label for="user_email" class="form__label">Correo electrónico</label>
        <div class="form__row">
          <input
            type="email"
            id="user_email"
            name="user_email"
            placeholder="ejemplo@correo.com"
            autocomplete="email"
            required
          >
          <button type="submit" id="btn-send" class="form__button">Enviar</button>
        </div>
        <p class="form__note">Gratis, sin suscripción. Te enviamos el acceso al instante.</p>
      </form>
    </section>
  </main>

  <!-- PANTALLA DE ÉXITO -->
  <div class="success" id="success-screen" role="status" aria-live="polite">
    <img
      class="success__gif"
      id="success-gif"
      data-src="./Moonwalk.gif"
      alt="Moonwalk"
    >
    <div class="success__shade" aria-hidden="true"></div>

    <div class="success__content">
      <p class="success__badge">Listo</p>
      <h2 class="success__title">¡Correo enviado!</h2>
      <p class="success__text">
        Revisa tu bandeja de entrada.<br>
        Si no lo ves, mira también la carpeta de <strong>spam</strong>.
      </p>
    </div>
  </div>

  <script src="./script.js"></script>
</body>
</html>
